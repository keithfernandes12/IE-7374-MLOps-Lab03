name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Train and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # fetch_california_housing downloads the data on first use; cache it between runs
      - name: Cache dataset
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: sklearn-data-california-housing

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Retrain the model
        run: python src/train.py

      - name: Run tests
        run: pytest --junitxml=pytest-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: pytest-report.xml

  docker:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t housing-api .

      - name: Start container
        run: docker run -d --name api -p 8000:8000 housing-api

      - name: Check health and a prediction
        run: |
          for i in $(seq 1 20); do curl -sf localhost:8000/ && break; sleep 1; done
          curl -sf localhost:8000/ | grep '"model_loaded":true'
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"med_inc":8.3252,"house_age":41,"ave_rooms":6.98,"ave_bedrms":1.02,"population":322,"ave_occup":2.56,"latitude":37.88,"longitude":-122.23}' \
            | grep median_house_value

      - name: Show container logs
        if: always()
        run: docker logs api
